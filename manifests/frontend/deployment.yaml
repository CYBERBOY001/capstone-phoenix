apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: phoenix

  labels:
    app: frontend

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      terminationGracePeriodSeconds: 30

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule

          labelSelector:
            matchLabels:
              app: frontend

      containers:
        - name: frontend

          image: ghcr.io/cyberboy001/taskapp-frontend:v.1.0.5

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: phoenix-config

          startupProbe:
            httpGet:
              path: /
              port: 80

            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 250m
              memory: 256Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 101

            allowPrivilegeEscalation: false

            readOnlyRootFilesystem: false

            capabilities:
              drop:
                - ALL

            seccompProfile:
              type: RuntimeDefault

          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 10