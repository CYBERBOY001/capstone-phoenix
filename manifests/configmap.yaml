apiVersion: v1
kind: ConfigMap

metadata:
  name: phoenix-config
  namespace: phoenix

data:
  # Application
  APP_ENV: "production"
  APP_NAME: "phoenix"

  # Backend
  BACKEND_HOST: "backend"
  BACKEND_PORT: "5000"

  # Frontend
  FRONTEND_HOST: "frontend"
  FRONTEND_PORT: "80"

  # PostgreSQL
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "phoenix"

  # Flask
  FLASK_ENV: "production"

  # API URL
  API_URL: "http://backend:5000"

  # Logging
  LOG_LEVEL: "INFO"