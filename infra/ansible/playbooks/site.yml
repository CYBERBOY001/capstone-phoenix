---
##################################################
# Harden Every Server
##################################################

- name: Harden all servers
  hosts: k3s_cluster
  become: true

  roles:
    - hardening

##################################################
# Install Control Plane
##################################################

- name: Install K3s Server
  hosts: server
  become: true

  roles:
    - k3s-server

##################################################
# Join Worker Nodes
##################################################

- name: Install K3s Agents
  hosts: agents
  become: true

  roles:
    - k3s-agent