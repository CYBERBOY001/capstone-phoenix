apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: taskapp
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/<username>/<repo>.git
    targetRevision: main
    path: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true